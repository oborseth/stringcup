<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stringcup E2EE Messenger</title>
  <style>
    /* CSS Custom Properties for Theming */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-tertiary: #e9ecef;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --text-tertiary: #adb5bd;
      --border-color: #dee2e6;
      --accent-primary: #0d6efd;
      --accent-hover: #0b5ed7;
      --success: #198754;
      --warning: #ffc107;
      --danger: #dc3545;
      --msg-out-bg: #0d6efd;
      --msg-out-text: #ffffff;
      --msg-in-bg: #e9ecef;
      --msg-in-text: #212529;
      --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
      --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 1rem;
      --radius-xl: 1.5rem;
    }

    /* Dark Mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1d23;
        --bg-secondary: #2d3139;
        --bg-tertiary: #3d4149;
        --text-primary: #e9ecef;
        --text-secondary: #adb5bd;
        --text-tertiary: #6c757d;
        --border-color: #495057;
        --accent-primary: #0d6efd;
        --accent-hover: #3d8bfd;
        --success: #198754;
        --warning: #ffc107;
        --danger: #dc3545;
        --msg-out-bg: #0d6efd;
        --msg-out-text: #ffffff;
        --msg-in-bg: #3d4149;
        --msg-in-text: #e9ecef;
        --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.3);
        --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.4);
      }
    }

    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Layout */
    .container {
      max-width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      min-height: 100vh;
    }

    /* Desktop: Split Layout */
    @media (min-width: 768px) {
      .container {
        grid-template-columns: 400px 1fr;
      }
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg-primary);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Mobile: Sidebar full width */
    @media (max-width: 767px) {
      .sidebar {
        display: none; /* Hidden by default on mobile */
      }

      .sidebar.active {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 1000;
      }
    }

    /* Header */
    .header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin: 0;
    }

    /* Section */
    .section {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 1rem;
    }

    /* Form Elements */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      font-size: 0.875rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      gap: 0.5rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--border-color);
    }

    .btn-small {
      padding: 0.375rem 0.75rem;
      font-size: 0.8125rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    /* Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 999px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      gap: 0.375rem;
    }

    .status-badge.success {
      background: rgba(25, 135, 84, 0.1);
      color: var(--success);
    }

    .status-badge.warning {
      background: rgba(255, 193, 7, 0.1);
      color: var(--warning);
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: currentColor;
    }

    /* Identity Dump */
    .identity-dump {
      font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      max-height: 150px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    /* Checkbox */
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 1.125rem;
      height: 1.125rem;
      cursor: pointer;
    }

    /* Chat Container */
    .chat-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-secondary);
      height: 100vh;
    }

    @media (max-width: 767px) {
      .chat-container {
        height: 100vh;
      }
    }

    /* Chat Header */
    .chat-header {
      padding: 1rem 1.5rem;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .mobile-menu-btn {
      display: none;
      padding: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
    }

    .mobile-close-btn {
      padding: 0.5rem;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      font-size: 1.5rem;
      line-height: 1;
    }

    @media (max-width: 767px) {
      .mobile-menu-btn {
        display: block;
      }

      .mobile-close-btn {
        display: block !important;
      }
    }

    @media (min-width: 768px) {
      .mobile-close-btn {
        display: none !important;
      }
    }

    /* Chat Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column-reverse;
      gap: 1rem;
    }

    .chat-messages:empty::after {
      content: 'No messages yet. Send a message to start chatting.';
      text-align: center;
      color: var(--text-tertiary);
      font-size: 0.875rem;
      margin: auto;
    }

    /* Message Bubble */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 70%;
      gap: 0.25rem;
    }

    .message.outgoing {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.incoming {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-header {
      font-size: 0.75rem;
      color: var(--text-tertiary);
      padding: 0 0.75rem;
    }

    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: var(--radius-lg);
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.outgoing .message-bubble {
      background: var(--msg-out-bg);
      color: var(--msg-out-text);
      border-bottom-right-radius: 0.375rem;
    }

    .message.incoming .message-bubble {
      background: var(--msg-in-bg);
      color: var(--msg-in-text);
      border-bottom-left-radius: 0.375rem;
    }

    /* Chat Input */
    .chat-input-container {
      padding: 1rem 1.5rem;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
    }

    .chat-input-wrapper {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 0.9375rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      color: var(--text-primary);
      resize: none;
      max-height: 120px;
      transition: all 0.2s;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .send-btn {
      flex-shrink: 0;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      background: var(--accent-primary);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Debug Log */
    .debug-log {
      font-family: "SF Mono", Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.75rem;
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Utility Classes */
    .text-muted {
      color: var(--text-tertiary);
      font-size: 0.8125rem;
    }

    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }
    .mb-2 { margin-bottom: 1rem; }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }

    /* Recipient Input in Chat */
    .recipient-input-group {
      margin-bottom: 0.75rem;
    }

    .recipient-input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
    }

    .recipient-input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "@noble/hashes/crypto": "/js/noble/hashes/esm/crypto.js?v=1.0.0",
      "@noble/hashes/sha512": "/js/noble/hashes/esm/sha512.js?v=1.0.0",
      "@noble/hashes/utils": "/js/noble/hashes/esm/utils.js?v=1.0.0"
    }
  }
  </script>
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <!-- Header -->
      <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div>
            <h1>🔐 Stringcup</h1>
            <p>End-to-end encrypted messaging</p>
          </div>
          <button class="mobile-close-btn" id="mobileCloseBtn" style="display: none;">✕</button>
        </div>
      </div>

      <!-- Identity Section -->
      <div class="section">
        <div class="section-title">Your Identity</div>

        <div class="form-group">
          <label class="form-label" for="externalId">User ID</label>
          <input class="form-input" id="externalId" placeholder="alice" />
        </div>

        <div class="form-group">
          <label class="form-label" for="displayName">Display Name</label>
          <input class="form-input" id="displayName" placeholder="Alice Smith" />
        </div>

        <div class="btn-group">
          <button class="btn btn-primary btn-small" id="btnGenerate">Generate New</button>
          <button class="btn btn-secondary btn-small" id="btnUpload">Register</button>
        </div>

        <div class="mt-1">
          <span class="status-badge" id="sessionStatus">
            <span class="status-dot"></span>
            No identity
          </span>
        </div>

        <details class="mt-2">
          <summary style="cursor: pointer; font-size: 0.875rem; color: var(--text-secondary);">Identity Details</summary>
          <div class="identity-dump mt-1" id="identityDump">(no identity)</div>
        </details>

        <div class="btn-group mt-2">
          <button class="btn btn-secondary btn-small" id="btnShowIdentity">Refresh</button>
          <button class="btn btn-secondary btn-small" id="btnClearIdentity">Clear All</button>
        </div>
      </div>

      <!-- Settings Section -->
      <div class="section">
        <div class="section-title">Settings</div>

        <label class="checkbox-label">
          <input type="checkbox" id="autoFetchToggle" checked>
          Auto-fetch messages (3s)
        </label>

        <details class="mt-2">
          <summary style="cursor: pointer; font-size: 0.875rem; color: var(--text-secondary);">Debug Console</summary>
          <div class="debug-log mt-1" id="log"></div>
        </details>

        <p class="text-muted mt-2">
          Tip: Open this page in multiple windows to test messaging between different users.
        </p>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
      <!-- Chat Header -->
      <div class="chat-header">
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <div class="chat-title">Messages</div>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages" id="inbox"></div>

      <!-- Chat Input -->
      <div class="chat-input-container">
        <div class="recipient-input-group">
          <input class="recipient-input" id="recipientId" placeholder="Recipient ID (e.g., bob)" />
        </div>
        <div class="chat-input-wrapper">
          <input class="chat-input" id="messageText" placeholder="Type a message..." autocomplete="off" />
          <button class="send-btn" id="btnSend" title="Send message">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      generateIdentity,
      uploadIdentity,
      loadIdentity,
      saveIdentity,
      clearIdentity,
      sendMessage,
      fetchMessages,
      startInboxWatcher,
      stopInboxWatcher,
    } from '/js/e2ee.js?v=1.0.1';

    const logEl = document.getElementById('log');
    const idDumpEl = document.getElementById('identityDump');
    const sessionStatusEl = document.getElementById('sessionStatus');
    const inboxEl = document.getElementById('inbox');
    const messageInput = document.getElementById('messageText');

    // Local chat history (per tab, not persisted to backend)
    const chatHistory = [];

    // Mobile menu toggle
    const sidebar = document.getElementById('sidebar');
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      sidebar.classList.add('active');
    });

    // Mobile menu close button
    document.getElementById('mobileCloseBtn').addEventListener('click', () => {
      sidebar.classList.remove('active');
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 767 && sidebar.classList.contains('active')) {
        if (!sidebar.contains(e.target) && !document.getElementById('mobileMenuBtn').contains(e.target)) {
          sidebar.classList.remove('active');
        }
      }
    });

    function log(msg) {
      const now = new Date().toISOString().replace('T', ' ').substring(0, 19);
      logEl.textContent += `[${now}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function setIdentityDump(identity) {
      if (!identity) {
        idDumpEl.textContent = '(no identity in localStorage)';
        sessionStatusEl.innerHTML = '<span class="status-dot"></span>No identity';
        sessionStatusEl.className = 'status-badge';
        return;
      }
      const copy = { ...identity };
      if (copy.privKeyB64 && copy.privKeyB64.length > 12) {
        copy.privKeyB64 = copy.privKeyB64.slice(0, 12) + '… (hidden)';
      }
      idDumpEl.textContent = JSON.stringify(copy, null, 2);

      if (identity.apiToken) {
        sessionStatusEl.innerHTML = `<span class="status-dot"></span>${identity.externalId} (authenticated)`;
        sessionStatusEl.className = 'status-badge success';
      } else {
        sessionStatusEl.innerHTML = `<span class="status-dot"></span>${identity.externalId} (no token)`;
        sessionStatusEl.className = 'status-badge warning';
      }
    }

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);

      if (diffMins < 1) return 'just now';
      if (diffMins < 60) return `${diffMins}m ago`;

      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h ago`;

      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d ago`;
    }

    function renderChatInbox() {
      inboxEl.innerHTML = '';
      if (chatHistory.length === 0) {
        return;
      }

      for (const item of chatHistory) {
        const msg = document.createElement('div');
        msg.className = 'message ' + (item.direction === 'out' ? 'outgoing' : 'incoming');

        const header = document.createElement('div');
        header.className = 'message-header';
        header.textContent = item.direction === 'out'
          ? `To ${item.recipientId} • ${formatTime(item.createdAt)}`
          : `From ${item.senderId} • ${formatTime(item.createdAt)}`;

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = item.text;

        msg.appendChild(header);
        msg.appendChild(bubble);
        inboxEl.appendChild(msg);
      }

      inboxEl.scrollTop = 0;
    }

    function addOutgoingMessage(recipientId, text) {
      const identity = loadIdentity();
      const ts = new Date().toISOString();

      chatHistory.unshift({
        direction: 'out',
        senderId: identity ? identity.externalId : '',
        recipientId,
        createdAt: ts,
        text,
      });

      renderChatInbox();
    }

    function addIncomingMessagesFromDecrypted(items) {
      const identity = loadIdentity();

      for (const item of items) {
        const raw = item.raw || item;
        const text = item.plaintext !== undefined
          ? item.plaintext
          : item.error
          ? '🔒 (decrypt error) ' + item.error
          : '(no plaintext)';

        chatHistory.unshift({
          direction: 'in',
          senderId: raw.sender_id,
          recipientId: identity ? identity.externalId : '',
          createdAt: raw.created_at || new Date().toISOString(),
          text,
        });
      }

      renderChatInbox();
    }

    // --- UI Event Handlers ---

    document.getElementById('btnGenerate').addEventListener('click', async () => {
      try {
        const externalId = document.getElementById('externalId').value.trim();
        const displayName = document.getElementById('displayName').value.trim() || null;
        if (!externalId) {
          alert('Please enter a user ID first');
          return;
        }
        log(`Generating new identity for "${externalId}"…`);
        const identity = generateIdentity(externalId, displayName);
        setIdentityDump(identity);
        log('Identity generated. Now calling uploadIdentity() to register & get token…');
        const res = await uploadIdentity();
        log('Upload response: ' + JSON.stringify(res));
        const idAfter = loadIdentity();
        setIdentityDump(idAfter);
      } catch (e) {
        log('ERROR (generate): ' + e.message);
      }
    });

    document.getElementById('btnUpload').addEventListener('click', async () => {
      try {
        const identity = loadIdentity();
        if (!identity) {
          alert('No identity in localStorage. Use "Generate New" first.');
          return;
        }

        const formId = document.getElementById('externalId').value.trim();
        const formName = document.getElementById('displayName').value.trim();
        if (formId && formId !== identity.externalId) {
          identity.externalId = formId;
        }
        if (formName && formName !== identity.displayName) {
          identity.displayName = formName;
        }
        saveIdentity(identity);
        setIdentityDump(identity);

        log('Registering identity with server…');
        const res = await uploadIdentity();
        log('Registration response: ' + JSON.stringify(res));
        const idAfter = loadIdentity();
        setIdentityDump(idAfter);
      } catch (e) {
        log('ERROR (upload): ' + e.message);
      }
    });

    document.getElementById('btnShowIdentity').addEventListener('click', () => {
      const identity = loadIdentity();
      setIdentityDump(identity);
      if (identity) {
        document.getElementById('externalId').value = identity.externalId;
        document.getElementById('displayName').value = identity.displayName || '';
      }
      log('Refreshed identity from localStorage.');
    });

    document.getElementById('btnClearIdentity').addEventListener('click', () => {
      if (!confirm('Clear identity and all local ratchet sessions?')) return;
      clearIdentity();
      setIdentityDump(null);
      chatHistory.length = 0;
      inboxEl.innerHTML = '';
      log('Cleared identity and sessions from localStorage.');
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btnSend').click();
      }
    });

    document.getElementById('btnSend').addEventListener('click', async () => {
      try {
        const identity = loadIdentity();
        if (!identity) {
          alert('No identity. Generate & register first.');
          return;
        }
        const recipientId = document.getElementById('recipientId').value.trim();
        const msgText = messageInput.value.trim();
        if (!recipientId) {
          alert('Enter a recipient ID.');
          return;
        }
        if (!msgText) {
          alert('Enter a message.');
          return;
        }
        log(`Sending encrypted message to "${recipientId}"…`);
        const res = await sendMessage(recipientId, msgText);
        log('Send response: ' + JSON.stringify(res));

        addOutgoingMessage(recipientId, msgText);

        messageInput.value = '';
        messageInput.focus();
      } catch (e) {
        log('ERROR (send): ' + e.message);
      }
    });

    document.getElementById('autoFetchToggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        log('Auto-fetch enabled (every 3 seconds)…');
        startInboxWatcher({
          decrypt: true,
          intervalMs: 3000,
          onBatch: (msgs) => {
            if (msgs.length > 0) {
              log(`Auto-fetch: received ${msgs.length} message(s).`);
              addIncomingMessagesFromDecrypted(msgs);
            }
          },
        });
      } else {
        stopInboxWatcher();
        log('Auto-fetch disabled.');
      }
    });

    document.addEventListener('visibilitychange', () => {
      const autoToggle = document.getElementById('autoFetchToggle');
      if (document.visibilityState === 'hidden') {
        stopInboxWatcher();
      } else if (autoToggle.checked) {
        startInboxWatcher({
          decrypt: true,
          intervalMs: 3000,
          onBatch: (msgs) => {
            if (msgs.length > 0) {
              log(`Auto-fetch: received ${msgs.length} message(s).`);
              addIncomingMessagesFromDecrypted(msgs);
            }
          },
        });
      }
    });

    // --- Initialization ---
    (function init() {
      const identity = loadIdentity();
      setIdentityDump(identity);
      if (identity) {
        document.getElementById('externalId').value = identity.externalId;
        document.getElementById('displayName').value = identity.displayName || '';
        log('Loaded identity from localStorage.');
      } else {
        log('No identity found. Create one to get started.');
      }
      renderChatInbox();

      // Start auto-fetch if checkbox is checked (default: on)
      const autoToggle = document.getElementById('autoFetchToggle');
      if (autoToggle.checked) {
        log('Auto-fetch enabled (every 3 seconds)…');
        startInboxWatcher({
          decrypt: true,
          intervalMs: 3000,
          onBatch: (msgs) => {
            if (msgs.length > 0) {
              log(`Auto-fetch: received ${msgs.length} message(s).`);
              addIncomingMessagesFromDecrypted(msgs);
            }
          },
        });
      }
    })();
  </script>
</body>
</html>
